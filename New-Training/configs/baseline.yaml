# HVT v3 Baseline Configuration
# Standard training without novel methods

# Dataset configuration
dataset_name: cifar10
dataset_config: null
image_key: img
label_key: label
streaming: true

# Model architecture
num_freq_bands: 4
num_evolution_layers: 3
hidden_dim: 64
num_classes: 10
image_size: 32
patch_size: 16

# Training parameters
total_steps: 10000
warmup_steps: 500
batch_size: 32
learning_rate: 3e-4
min_learning_rate: 1e-6
weight_decay: 0.01
gradient_clip: 1.0

# Harmonic-specific parameters
base_omega: 0.2618
sync_target: 0.618
oscillator_warmup_weight: 0.1

# Novel methods (all disabled for baseline)
novel_methods:
  use_sync_aware_loss: false
  use_physics_informed_optimizer: false
  use_adaptive_breathing: false
  use_multi_scale_curriculum: false
  use_geometric_consistency: false
  
  sync_aware_loss:
    lambda_sync: 0.1
    lambda_diversity: 0.05
    target_sync: 0.618
    sync_margin: 0.1
    use_adaptive_sync: true
    sync_history_window: 100
  
  physics_optimizer:
    optimizer_type: AdamW
    symplectic_coef: 0.01
    energy_preservation: true
    phase_momentum: 0.9
    use_natural_gradients: false
    damping_adaptation: true
  
  adaptive_breathing:
    breathing_type: sync_triggered
    base_interval: 100
    sync_threshold_low: 0.4
    sync_threshold_high: 0.7
    energy_threshold: 0.1
    breathing_duration: 10
    pressure_reduction: 0.5
  
  curriculum:
    curriculum_type: frequency_expansion
    start_bands: 2
    max_bands: 6
    expansion_schedule: exponential
    expansion_rate: 0.1
    gabor_scale_progression: [0.5, 0.7, 1.0, 1.3, 1.6]
    freeze_previous_bands: true
  
  geometric_consistency:
    lambda_geometric: 0.1
    consistency_type: se3_composition
    se3_epsilon: 1e-6
    phase_smoothness_weight: 0.01
    manifold_reg_weight: 0.05
    use_parallel_transport: false

# Hardware
device: cpu
num_workers: 0
pin_memory: false
mixed_precision: false

# Checkpointing
checkpoint_dir: checkpoints
save_every: 500
log_every: 25
keep_best_n: 3

# Validation
val_every: 1000
val_steps: 100

# Logging
use_wandb: false
wandb_project: hvt_v3_training
experiment_name: null